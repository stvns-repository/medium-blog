AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 04 Base Workspace'

Parameters:
  AdminIP:
    Type: String
    Description: "Your Public IP for SSH and HTTP access (e.g., 1.2.3.4/32)."
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'

Resources:
  # 1. S3 bucket for Terraform state
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tf-state-lab-04-${AWS::AccountId}-${AWS::Region}-lab"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 2. VPC & Networking
  LabVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: Lab-04-VPC }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LabVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVPC
      CidrBlock: 10.0.0.0/26
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LabVPC

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # 3. Scoped IAM Role (No AdministratorAccess)
  DevOpsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [ec2.amazonaws.com] }
            Action: ['sts:AssumeRole']
      ManagedPolicyArns: 
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        # S3 State Bucket Access
        - PolicyName: Lab04TerraformStateAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource:
                  - !Sub 'arn:aws:s3:::tf-state-lab-04-${AWS::AccountId}-${AWS::Region}-lab'
                  - !Sub 'arn:aws:s3:::tf-state-lab-04-${AWS::AccountId}-${AWS::Region}-lab/*'
        
        # KMS - Provisioning Access
        - PolicyName: Lab04KMSProvisioningAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'kms:CreateKey'
                  - 'kms:CreateAlias'
                  - 'kms:DeleteAlias'
                  - 'kms:DisableKeyRotation'
                  - 'kms:ListAliases'
                  - 'kms:DescribeKey'
                  - 'kms:GetKeyPolicy'
                  - 'kms:PutKeyPolicy'
                  - 'kms:TagResource'
                  - 'kms:UntagResource'
                  - 'kms:ListResourceTags'
                  - 'kms:EnableKeyRotation'
                  - 'kms:GetKeyRotationStatus'
                  - 'kms:ScheduleKeyDeletion'
                  - 'kms:GenerateDataKey'
                  - 'kms:Encrypt'
                  - 'kms:Decrypt'
                  - 'kms:CreateGrant'
                Resource: '*'

        # Secrets Manager - Provisioning Access
        - PolicyName: Lab04SecretsManagerProvisioningAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:CreateSecret'
                  - 'secretsmanager:DescribeSecret'
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:PutSecretValue'
                  - 'secretsmanager:TagResource'
                  - 'secretsmanager:GetResourcePolicy'
                  - 'secretsmanager:DeleteSecret'
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lab04/app/credentials*'

        # IAM Policy/Role Provisioning
        - PolicyName: Lab04IAMProvisioningAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'iam:CreateRole'
                  - 'iam:GetRole'
                  - 'iam:DeleteRole'
                  - 'iam:PutRolePolicy'
                  - 'iam:GetRolePolicy'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:PassRole'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/lab04-*'
              - Effect: Allow
                Action:
                  - 'iam:CreatePolicy'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'iam:GetPolicy'
                  - 'iam:DeletePolicy'
                  - 'iam:ListPolicyVersions'
                  - 'iam:GetPolicyVersion'
                  - 'iam:CreatePolicyVersion'
                  - 'iam:DeletePolicyVersion'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/Lab04*'

  DevOpsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref DevOpsInstanceRole]

  # 4. Security Group
  Lab04SG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ingress for Lab 04 Workspace (SSH, HTTP/S, ArgoCD UI)
      VpcId: !Ref LabVPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AdminIP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AdminIP }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminIP }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Ref AdminIP }
      SecurityGroupEgress: [{ IpProtocol: -1, CidrIp: 0.0.0.0/0 }]

  # 5. EC2 Instance
  DevOpsHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet
      IamInstanceProfile: !Ref DevOpsInstanceProfile
      SecurityGroupIds: [!Ref Lab04SG]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      Tags: [{ Key: Name, Value: lab-04-server }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y docker
          dnf install -y curl git jq
          systemctl enable --now docker

          # Setup Swap (4GB)
          dd if=/dev/zero of=/swapfile bs=128M count=32
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile swap swap defaults 0 0' >> /etc/fstab

          # Create a user for Terraform & Kubernetes ops
          adduser terraform_user
          usermod -aG wheel terraform_user
          usermod -aG docker terraform_user
          echo "terraform_user ALL=(ALL) NOPASSWD:ALL" | tee /etc/sudoers.d/terraform_user
          
          useradd -m -s /bin/bash kubeuser
          usermod -aG docker kubeuser
          mkdir -p /home/kubeuser/.kube
          chown -R kubeuser:kubeuser /home/kubeuser/.kube

          # Install Terraform
          dnf install -y dnf-plugins-core
          dnf config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
          dnf -y install terraform
          
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          mv ./kubectl /usr/local/bin/kubectl

          # Install Minikube binary (not started yet)
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          install minikube-linux-amd64 /usr/local/bin/minikube
          rm -f minikube-linux-amd64

  # 6. Elastic IP
  DevOpsEIP:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }

  DevOpsEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt DevOpsEIP.AllocationId
      InstanceId: !Ref DevOpsHost

Outputs:
  DevOpsPublicIP:
    Description: "Public IP of the EC2 Instance"
    Value: !Ref DevOpsEIP
  TFStateBucket:
    Description: "S3 Bucket Name for Terraform State"
    Value: !Ref TerraformStateBucket
  DevOpsRoleArn:
    Description: "IAM Role ARN of the EC2 Instance"
    Value: !GetAtt DevOpsInstanceRole.Arn
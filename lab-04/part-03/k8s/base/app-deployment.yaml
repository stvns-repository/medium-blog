apiVersion: apps/v1
kind: Deployment
metadata:
  name: first-testing-phase
  namespace: lab-04-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: first-testing-phase
  template:
    metadata:
      labels:
        app: first-testing-phase
    spec:
      containers:
      - name: app-container
        image: nginx:alpine
        # Mount the secret
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
      # Define the volume
      volumes:
      - name: secret-volume
        secret:
          secretName: app-secret-k8s
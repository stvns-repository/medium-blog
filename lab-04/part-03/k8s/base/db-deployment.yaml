apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-db
  namespace: lab-04-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-db
  template:
    metadata:
      labels:
        app: backend-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "admin-user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret-k8s
              key: DATABASE_PASSWORD
        - name: POSTGRES_DB
          value: "appdb"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: lab-04-app
spec:
  selector:
    app: backend-db
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
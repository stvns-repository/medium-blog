apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-db
  namespace: lab-04-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-db
  template:
    metadata:
      labels:
        app: backend-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "admin-user"
        - name: POSTGRES_DB
          value: "appdb"
        - name: POSTGRES_PASSWORD_FILE
          value: "/etc/secrets/DATABASE_PASSWORD"
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
      volumes:
      - name: secret-volume
        secret:
          secretName: app-secret-k8s
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-credentials-external-secret
  namespace: lab-04-app
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: app-secret-k8s
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: lab04/app/credentials
        property: API_PASSWORD
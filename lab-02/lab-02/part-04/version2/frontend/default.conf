server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # This routes /api/cart requests to the backend service internally
    location /api/ {
        proxy_pass http://cart-service:80; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
<!DOCTYPE html>
<html>
<head>
    <title>Part 4 of the GitOps Lab - Using placekittens</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 50px; }
        .product-card { background: white; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { border-radius: 10px; margin-bottom: 15px; }
        button { background: #ff9900; border: none; padding: 10px 20px; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #cart-status { margin-top: 15px; color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Adopt a Cloud Kitten</h1>
    <div class="product-card">
        <img src="https://placekittens.com/300/200" alt="Kitten">
        <br>
        <button onclick="addToCart()">Add to Cart</button>
        <p id="cart-status"></p>
    </div>

    <script>
        function addToCart() {
            document.getElementById('cart-status').innerText = "Added to cart! GitOps is purring. 🐾";
            console.log("Cart updated.");
        }
    </script>
</body>

AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab-02: CI/CD Lab with GitLab, ArgoCD, Minikube, and Terraform'

Parameters:
  UserIP:
    Type: String
    Description: 'Enter your Public IPv4 address (e.g., 1.2.3.4/32) for Security Group access.'
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
    ConstraintDescription: 'Must be a valid IPv4 CIDR range (x.x.x.x/32).'

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'

Resources:
  # --- S3 Bucket for Terraform State ---
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::AccountId}-lab02-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true 
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # --- Network Layer ---
  LabVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true

  LabSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVPC
      CidrBlock: 10.0.0.0/26
      MapPublicIpOnLaunch: true

  InternetGateway: { Type: AWS::EC2::InternetGateway }
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref LabVPC, InternetGatewayId: !Ref InternetGateway }

  PublicRouteTable: { Type: AWS::EC2::RouteTable, Properties: { VpcId: !Ref LabVPC } }
  DefaultRoute:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref LabSubnet, RouteTableId: !Ref PublicRouteTable }

  # --- Elastic IP (Permanent Public Address) ---
  LabElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  AssociateEIP:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt LabElasticIP.AllocationId
      InstanceId: !Ref LabInstance

  # --- Security Group ---
  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Lab Access
      VpcId: !Ref LabVPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref UserIP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref UserIP }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Ref UserIP }
        - { IpProtocol: tcp, FromPort: 8888, ToPort: 8888, CidrIp: !Ref UserIP }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref UserIP }

  # --- IAM Role ---
  LabInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: [ec2.amazonaws.com] }, Action: ['sts:AssumeRole'] }]
      ManagedPolicyArns: 
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - 'arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess'
      Policies:
        - PolicyName: TerraformS3NativeBackend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - "s3:ListBucket"
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                  - "s3:GetBucketObjectLockConfiguration"
                Resource: 
                  - !GetAtt TerraformStateBucket.Arn
                  - !Sub "${TerraformStateBucket.Arn}/*"

  LabInstanceProfile: { Type: AWS::IAM::InstanceProfile, Properties: { Roles: [!Ref LabInstanceRole] } }

  # --- T3.Large Instance ---
  LabInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.large
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref LabSubnet
      SecurityGroupIds: [!Ref LabSecurityGroup]
      IamInstanceProfile: !Ref LabInstanceProfile
      Tags:
        - Key: Name
          Value: GitOps-Server
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 25, VolumeType: gp3 }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y docker
          systemctl start docker
          systemctl enable docker

          # Create Users & Pre-configure Docker Groups
          useradd kube_user
          useradd terraform_user
          useradd -m -s /bin/bash gitlab-runner
          usermod -aG docker kube_user
          usermod -aG docker terraform_user
          usermod -aG docker gitlab-runner

          # 4GB Swap Space for Stability
          fallocate -l 4G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          # Core Tools Installation
          dnf install -y dnf-plugins-core
          dnf config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
          dnf -y install terraform
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          install minikube-linux-amd64 /usr/local/bin/minikube

          # GitLab CE & Runner Installation
          curl https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.rpm.sh | bash
          EXTERNAL_URL="http://gitlab.cicdpractice.com" dnf install -y gitlab-ce
          
          curl -L "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.rpm.sh" | bash
          dnf install -y gitlab-runner
          systemctl enable gitlab-runner
          systemctl start gitlab-runner

          # Prep ArgoCD manifest
          mkdir -p /home/kube_user/manifests
          curl -o /home/kube_user/manifests/argocd-install.yaml https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          chown -R kube_user:kube_user /home/kube_user/manifests

Outputs:
  InstancePublicIP: { Value: !Ref LabElasticIP }
  S3BucketName: { Value: !Ref TerraformStateBucket }